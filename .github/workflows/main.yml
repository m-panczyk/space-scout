# Godot CI/CD for Space Scout Game
name: Build and Deploy Space Scout

on:
  push:
    branches:
      - master
      - pc
      - mobile
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  EXPORT_NAME: Space_Scout
  GODOT_VERSION: "4.4.1"

jobs:
  export-linux:
    name: Export Linux
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'pc') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/pc' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true  # This will download export templates
      
      - name: Setup Build Directories
        run: |
          mkdir -p build/linux
      
      - name: Export Linux Build
        run: |
          godot --headless --verbose --export-release "Linux" "./build/linux/$EXPORT_NAME.x86_64"
      
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/linux/
          retention-days: 5

  export-windows:
    name: Export Windows
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'pc') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/pc' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true
      
      - name: Setup Build Directories
        run: |
          mkdir -p build/windows
      
      - name: Export Windows Build
        run: |
          godot --headless --verbose --export-release "Windows Desktop" "./build/windows/$EXPORT_NAME.exe"
      
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows/
          retention-days: 5

  # Stage 1: Export the .app bundle on Linux (more memory available)
  export-mac-stage1:
    name: Export Mac (Stage 1 - App Bundle on Linux)
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'pc') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/pc' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Setup Build Directories
        run: mkdir -p build/mac

      - name: Export macOS App Bundle on Linux
        run: |
          # Export .app bundle using Linux runner (more memory available)
          godot --headless --disable-render-loop --verbose \
            --export-release "macOS" "./build/mac/$EXPORT_NAME.app"
        env:
          # Can use more aggressive settings on Linux
          GODOT_MEMORY_LIMIT: 16384

      - name: Verify App Bundle Creation
        run: |
          echo "Contents of build/mac:"
          ls -la build/mac/ || echo "Directory doesn't exist"
          if [ -d "build/mac/$EXPORT_NAME.app" ]; then
            echo "✅ .app bundle created successfully on Linux!"
            find "build/mac/$EXPORT_NAME.app" -type f | head -10
            # Check bundle size
            du -sh "build/mac/$EXPORT_NAME.app"
          else
            echo "❌ No .app bundle found"
            exit 1
          fi

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: mac-app-bundle
          path: build/mac/${{ env.EXPORT_NAME }}.app/
          retention-days: 5

  # Stage 2: Create DMG package on macOS (lightweight operation)
  export-mac-stage2:
    name: Export Mac (Stage 2 - DMG Package on macOS)
    runs-on: macos-latest
    needs: export-mac-stage1
    if: contains(github.event.head_commit.modified, 'pc') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/pc' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download App Bundle
        uses: actions/download-artifact@v4
        with:
          name: mac-app-bundle
          path: app-bundle/

      - name: Setup DMG Build Environment
        run: |
          mkdir -p build/mac
          # Move app bundle to build directory
          mv "app-bundle" "build/mac/$EXPORT_NAME.app"
          echo "App bundle moved to build directory:"
          ls -la "build/mac/$EXPORT_NAME.app/"

      - name: Create DMG Package
        run: |
          # Create a temporary directory for DMG contents
          mkdir -p dmg_temp
          
          # Copy the .app bundle to temp directory
          cp -R "build/mac/$EXPORT_NAME.app" dmg_temp/
          
          # Create Applications symlink for easy installation
          ln -s /Applications dmg_temp/Applications
          
          # Create the DMG with better compression
          hdiutil create -volname "Space Scout" \
                         -srcfolder dmg_temp \
                         -ov \
                         -format UDZO \
                         -imagekey zlib-level=9 \
                         "build/mac/$EXPORT_NAME.dmg"
          
          # Clean up temp directory
          rm -rf dmg_temp
          
          # Verify DMG was created and show size
          if [ -f "build/mac/$EXPORT_NAME.dmg" ]; then
            echo "✅ DMG created successfully:"
            ls -la "build/mac/$EXPORT_NAME.dmg"
            du -sh "build/mac/$EXPORT_NAME.dmg"
          else
            echo "❌ DMG creation failed"
            exit 1
          fi

      - name: Upload Mac DMG
        uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: build/mac/*.dmg
          retention-days: 5

  export-android:
    name: Export Android
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'mobile') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/mobile' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true
      
      - name: Setup Build Directories
        run: |
          mkdir -p build/android
      
      # Fix the export path to match export_presets.cfg
      - name: Export Android Build
        run: |
          godot --headless --verbose --export-debug "Android" "./build/android/$EXPORT_NAME.apk"
      
      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build/android/
          retention-days: 5

  export-web:
    name: Export Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true
      
      - name: Setup Build Directories
        run: |
          mkdir -p build/web
      
      - name: Export Web Build
        run: |
          godot --headless --verbose --export-release "Web" "./build/web/index.html"
      
      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/
          retention-days: 5

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [export-web, export-linux, export-windows, export-mac-stage2, export-android]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Setup deploy directory
        run: |
          mkdir -p deploy
          
          # Copy web build to root
          if [ -d "artifacts/web-build" ]; then
            echo "Copying web build to root..."
            cp -r artifacts/web-build/* deploy/
          fi
          
          # Create downloads directory for other builds
          mkdir -p deploy/downloads
          
          # Copy other builds to downloads directory
          for dir in linux windows mac android; do
            if [ -d "artifacts/${dir}-build" ]; then
              echo "Copying ${dir} build..."
              mkdir -p deploy/downloads/${dir}
              cp -r artifacts/${dir}-build/* deploy/downloads/${dir}/
            fi
          done
          
          # Create a simple downloads page
          cat > deploy/downloads/index.html << EOF
          <!DOCTYPE html>
          <html>
          <head>
              <title>Space Scout Downloads</title>
              <style>
                  body {
                      font-family: Arial, sans-serif;
                      max-width: 800px;
                      margin: 40px auto;
                      padding: 20px;
                      background: #1a1a1a;
                      color: #fff;
                  }
                  h1 { text-align: center; color: #4CAF50; }
                  .build-list {
                      list-style: none;
                      padding: 0;
                  }
                  .build-list li {
                      background: #333;
                      margin: 10px 0;
                      padding: 15px;
                      border-radius: 5px;
                  }
                  .build-list a {
                      color: #4CAF50;
                      text-decoration: none;
                      font-weight: bold;
                  }
                  .build-list a:hover {
                      text-decoration: underline;
                  }
                  .back-link {
                      display: block;
                      text-align: center;
                      margin-top: 30px;
                  }
                  .file-size {
                      color: #888;
                      font-size: 0.9em;
                      margin-left: 10px;
                  }
              </style>
          </head>
          <body>
              <h1>Space Scout Downloads</h1>
              <ul class="build-list">
                  <li>🐧 <a href="linux/$EXPORT_NAME.x86_64">Linux Build</a><span class="file-size">(.x86_64)</span></li>
                  <li>🪟 <a href="windows/$EXPORT_NAME.exe">Windows Build</a><span class="file-size">(.exe)</span></li>
                  <li>🍎 <a href="mac/$EXPORT_NAME.dmg">macOS Build</a><span class="file-size">(.dmg)</span></li>
                  <li>📱 <a href="android/$EXPORT_NAME.apk">Android Build</a><span class="file-size">(.apk)</span></li>
              </ul>
              <a href="../" class="back-link">← Back to Web Game</a>
          </body>
          </html>
          EOF
          
          # Add headers file for proper MIME types
          cat > deploy/_headers << EOF
          /*
              Cross-Origin-Embedder-Policy: require-corp
              Cross-Origin-Opener-Policy: same-origin
          /downloads/*
              Content-Type: application/octet-stream
          EOF
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
